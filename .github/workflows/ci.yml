name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FalaTina/package-lock.json

      - name: Install dependencies
        working-directory: FalaTina
        run: npm ci

      - name: Type check
        working-directory: FalaTina
        run: npm run typecheck

      - name: Lint
        working-directory: FalaTina
        run: npm run lint

      - name: Data integrity test
        working-directory: FalaTina
        run: npm test

      - name: Build
        working-directory: FalaTina
        run: npm run build
